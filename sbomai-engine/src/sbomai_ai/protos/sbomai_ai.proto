syntax = "proto3";

package sbomai_ai;

// Service definition
service SbomaiAiService {
  // Analyze SBOM document
  rpc AnalyzeSbom(AnalyzeSbomRequest) returns (AnalyzeSbomResponse) {}
  
  // Stream analysis results
  rpc StreamAnalysis(StreamAnalysisRequest) returns (stream StreamAnalysisResponse) {}
}

// Request messages
message AnalyzeSbomRequest {
  string sbom_data = 1;  // SBOM document (JSON/XML)
  string format = 2;     // SBOM format (SPDX/CycloneDX)
}

message StreamAnalysisRequest {
  string sbom_data = 1;  // SBOM document
  string format = 2;     // SBOM format
}

// Response messages
message AnalyzeSbomResponse {
  GraphAnalysis graph_analysis = 1;
  RiskAnalysis risk_analysis = 2;
  Predictions predictions = 3;
  GnnPredictions gnn_predictions = 4;
  Explanations explanations = 5;
}

message StreamAnalysisResponse {
  string type = 1;  // Response type
  bytes data = 2;   // Serialized response data
}

// Graph analysis
message GraphAnalysis {
  message Metrics {
    int32 num_nodes = 1;
    int32 num_edges = 2;
    int32 num_components = 3;
    int32 num_vulnerabilities = 4;
    int32 num_licenses = 5;
    float avg_dependencies = 6;
    int32 max_depth = 7;
  }
  
  message Community {
    int32 id = 1;
    int32 size = 2;
    repeated Component components = 3;
    repeated Vulnerability vulnerabilities = 4;
  }
  
  message CriticalPath {
    Vulnerability vulnerability = 1;
    Component component = 2;
    repeated Node path = 3;
    int32 length = 4;
  }
  
  Metrics metrics = 1;
  repeated Community communities = 2;
  repeated CriticalPath critical_paths = 3;
}

// Risk analysis
message RiskAnalysis {
  message RiskFactor {
    string type = 1;
    float score = 2;
    string description = 3;
  }
  
  message ComponentRisk {
    Component component = 1;
    float risk_score = 2;
    repeated RiskFactor risk_factors = 3;
  }
  
  float overall_risk_score = 1;
  repeated ComponentRisk component_risks = 2;
  repeated string recommendations = 3;
}

// Predictions
message Predictions {
  message VulnerabilityPrediction {
    Component component = 1;
    float exploit_probability = 2;
    float confidence = 3;
    map<string, float> feature_importance = 4;
  }
  
  repeated VulnerabilityPrediction predictions = 1;
}

// GNN predictions
message GnnPredictions {
  message NodePrediction {
    string node_id = 1;
    float risk_score = 2;
    float attention_score = 3;
  }
  
  message RiskPath {
    repeated string node_ids = 1;
    float path_risk = 2;
  }
  
  repeated NodePrediction node_predictions = 1;
  repeated RiskPath risk_paths = 2;
}

// Explanations
message Explanations {
  message RootCauseAnalysis {
    string summary = 1;
    repeated string details = 2;
    repeated string recommendations = 3;
  }
  
  message AttackVectorAnalysis {
    string summary = 1;
    repeated string vectors = 2;
    repeated string mitigations = 3;
  }
  
  message ImpactAnalysis {
    string summary = 1;
    repeated string impacts = 2;
    float severity = 3;
  }
  
  RootCauseAnalysis root_cause = 1;
  AttackVectorAnalysis attack_vectors = 2;
  ImpactAnalysis impact = 3;
  repeated string recommendations = 4;
}

// Common messages
message Component {
  string name = 1;
  string version = 2;
  string purl = 3;
  map<string, string> metadata = 4;
}

message Vulnerability {
  string id = 1;
  string description = 2;
  float cvss_score = 3;
  string cvss_vector = 4;
  map<string, string> metadata = 5;
}

message Node {
  string id = 1;
  string type = 2;
  map<string, string> data = 3;
}