server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sbomai-core
  main:
    allow-bean-definition-overriding: true # ADDED: This allows multiple beans with the same name, fixing a previous error.

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

# SBOM AI Configuration
sbomai:
  upload:
    directory: ./uploads
  parser:
    go:
      executable: ./sbomai-parser-go/sbomai-parser.exe
      timeout: 30000
  security:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

# Logging Configuration
logging:
  level:
    com.sbomai.core: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs # CHANGED: Using the standard OpenAPI 3 path for JSON documentation
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    disable-swagger-default-url: true
    filter: true
    try-it-out-enabled: true
    deep-linking: true
    display-operation-id: false
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    default-model-render-expressions: true
    max-displayed-tags: 10
    show-extensions: true
    show-common-extensions: true
    supported-submit-methods:
      - get
      - post
      - put
      - delete
      - patch