# SBOMAI Core Application Configuration
spring:
  application:
    name: sbomai-core
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:sbomai
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  
# Logging Configuration
logging:
  level:
    com.sbomai: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# SBOMAI Specific Configuration
sbomai:
  core:
    # Analysis Configuration
    analysis:
      default-timeout: 300000 # 5 minutes in milliseconds
      max-concurrent-analyses: 10
      enable-parallel-processing: true
    
    # Vulnerability Scanner Configuration
    scanner:
      nvd:
        enabled: true
        api-key: ${NVD_API_KEY:}
        rate-limit: 1000 # requests per hour
      oss-index:
        enabled: true
        username: ${OSS_INDEX_USERNAME:}
        token: ${OSS_INDEX_TOKEN:}
      osv:
        enabled: true
        api-url: https://api.osv.dev/v1
    
    # AI Analysis Configuration
    ai:
      openai:
        enabled: true
        api-key: ${OPENAI_API_KEY:}
        model: gpt-4
        max-tokens: 4000
        temperature: 0.3
      local:
        enabled: false
        model-path: ${LOCAL_MODEL_PATH:}
    
    # Policy Enforcement Configuration
    policy:
      strict-mode: false
      default-policies:
        - license-compliance
        - security-thresholds
        - component-restrictions
      blocking-violations:
        - critical-vulnerabilities
        - forbidden-licenses

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,capabilities
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: sbomai-core
      module: core

# Actuator Configuration
management.endpoints.web.base-path: /actuator
management.endpoint.health.show-details: always 