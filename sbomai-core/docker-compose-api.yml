version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sbomai-postgres
    environment:
      POSTGRES_DB: sbomai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - sbomai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Spring Boot API
  sbomai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbomai-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sbomai
      DB_USERNAME: postgres
      DB_PASSWORD: password
      SBOMAI_UPLOAD_DIRECTORY: /app/uploads
      SBOMAI_PARSER_GO_EXECUTABLE: /app/sbomai-parser-go/sbomai-parser.exe
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ../sbomai-parser-go:/app/sbomai-parser-go
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sbomai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: sbomai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sbomai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus (for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: sbomai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - sbomai-network

  # Grafana (for dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: sbomai-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - sbomai-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  sbomai-network:
    driver: bridge 