version: '3.8'

services:
  # Core SBOMAI Services
  sbomai-core:
    build:
      context: .
      dockerfile: sbomai-core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SBOMAI_PARSER_URL=http://sbomai-parser:8081
      - SBOMAI_VULNSCAN_URL=http://sbomai-vulnscan:8082
      - SBOMAI_POLICY_URL=http://sbomai-policy:8083
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - prometheus
      - grafana
    networks:
      - sbomai-network
    volumes:
      - ./logs:/app/logs

  sbomai-parser:
    build:
      context: .
      dockerfile: sbomai-parser/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
    networks:
      - sbomai-network
    volumes:
      - ./logs:/app/logs

  sbomai-vulnscan:
    build:
      context: .
      dockerfile: sbomai-vulnscan/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - NVD_API_KEY=${NVD_API_KEY}
    networks:
      - sbomai-network
    volumes:
      - ./logs:/app/logs

  sbomai-policy:
    build:
      context: .
      dockerfile: sbomai-policy/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
    networks:
      - sbomai-network
    volumes:
      - ./logs:/app/logs

  sbomai-cli:
    build:
      context: .
      dockerfile: sbomai-cli/Dockerfile
    volumes:
      - ./sboms:/app/sboms
      - ./reports:/app/reports
    environment:
      - SBOMAI_CORE_URL=http://sbomai-core:8080
    networks:
      - sbomai-network
    depends_on:
      - sbomai-core

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - sbomai-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sbomai2024
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - sbomai-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - sbomai-network

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - sbomai-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  sbomai-network:
    driver: bridge 